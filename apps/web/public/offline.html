<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>InWIF · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:grid;place-items:center;background:radial-gradient(700px 360px at 20% -10%,rgba(0,229,155,.14),transparent 60%),radial-gradient(600px 320px at 100% 0,rgba(34,229,255,.1),transparent 60%),#000}
  main{max-width:360px;padding:32px;text-align:center}
  img{width:64px;height:64px}
  h1{font-size:26px;letter-spacing:-.02em;margin:24px 0 8px}
  p{color:#8b8d98;line-height:1.55;margin:0}
  button{margin-top:28px;background:#fff;color:#000;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>You&rsquo;re offline</h1>
  <p>InWIF needs an internet connection to read the blockchain. Your wallet and keys are safe on this device.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
