<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F2F0">
<title>InWIF · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#F6F2F0;color:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:grid;place-items:center;background:radial-gradient(700px 400px at 0% -10%,rgba(222,205,232,.75),transparent 60%),radial-gradient(700px 420px at 100% 10%,rgba(249,222,205,.8),transparent 60%),#F6F2F0}
  main{max-width:360px;padding:32px;text-align:center}
  img{width:72px;height:72px;border-radius:20px}
  h1{font-size:26px;letter-spacing:-.02em;margin:24px 0 8px}
  p{color:#5F5B57;line-height:1.55;margin:0}
  button{margin-top:28px;background:#E8622C;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>You&rsquo;re offline</h1>
  <p>InWIF needs an internet connection to read the blockchain. Your wallet and keys are safe on this device.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
