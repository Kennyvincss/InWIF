[package]
name = "inwif-firmware-core"
version = "0.1.0"
edition = "2021"
description = "InWIF hardware wallet firmware core: IWDP v1 protocol, EIP-1559 decoding and secp256k1 signing. no_std + alloc."
license = "MIT"

[features]
default = ["std"]
std = []

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
zeroize = { version = "1", default-features = false }
subtle = { version = "2", default-features = false }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
